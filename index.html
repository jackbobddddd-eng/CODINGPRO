<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shady Games | Gaming Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="poki-wrapper">
        <nav class="poki-header">
            <div class="logo">SHADY<span>GAMES</span></div>
            <div class="search-container">
                <input type="text" id="gameSearch" placeholder="Search games">
                <button id="randomBtn">Random Game 🎲</button>
                <button id="infoBtn">Library Guide 📖</button>
                <button id="feedbackBtn">Feedback 💬</button>
            </div>
        </nav>

        <main id="gameGrid" class="poki-grid"></main>
    </div>

    <div id="infoModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div id="manualContent"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
